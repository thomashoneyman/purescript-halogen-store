name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm

      - name: Install pinned development tools
        run: npm ci

      - name: Build source and examples, smoke-test runner, verify formatting
        run: npm run check

      - name: Verify dependency locks remain unchanged
        run: git diff --exit-code -- spago.yaml example/spago.yaml spago.lock package-lock.json
